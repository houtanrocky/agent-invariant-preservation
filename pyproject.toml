[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-invariant-preservation"
version = "0.1.0"
description = "Reproducible infrastructure for a planned coding-agent invariant study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["black==25.9.0", "pyflakes==3.2.0"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
researchctl = "researchctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 100
