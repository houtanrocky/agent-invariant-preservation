availability_assessment: Existing HTTP request-key replay is implemented, but direct
  Buy by the original buyer returns ErrOrderAlreadySold. No equivalent service retry
  success exists.
novel_change_assessment: Replaces underspecified refund candidate with a defined service-level
  retry extension; no refund or daily-limit changes.
