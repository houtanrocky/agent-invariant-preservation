schema_version: '1.0'
task_id: T001
title: Retry-safe purchase service outcome
kind: backend_change
baseline_commit: 58913f27161296bab0d3d223e7452a370cba580d
problem_description: 'Extend OrderServiceImpl.Buy(ctx, orderID, buyerID) with durable
  logical retry success: a sold order retried by its recorded, non-null purchaser
  returns nil, even without an HTTP idempotency key. Use the original purchase identity,
  not current item ownership, to recognize this outcome. This is a service contract
  extension; preserve public signatures, schema, existing request-key semantics and
  all other purchase eligibility rules.'
expected_behavior:
- First purchase still atomically transfers the price and item and marks the order
  sold.
- Sequential or concurrent retries by the original recorded purchaser return nil and
  do not write state or audit rows.
- A later transfer of the item does not invalidate the old purchaser retry or transfer
  the item again.
- A different buyer, or sold order with no recorded buyer, remains rejected; unsold
  eligibility rules remain unchanged.
- Failed persistence rolls back payment, ownership, order and audit effects; a later
  valid attempt can succeed.
existing_invariants:
- id: purchase-effects-once
  definition: For one sold order, retries preserve exactly one paired debit/credit
    and one ownership transfer; all guild gold is conserved.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/order/service.go:Buy;
    internal/postgres/tx.go; internal/postgres/concurrency_test.go
- id: purchase-authorization
  definition: Only the recorded purchaser may receive retry success for a sold order;
    other buyers cannot acquire it or modify its outcome.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/order/service.go:Buy
- id: purchase-atomicity
  definition: A failed purchase leaves balances, reserves, item/order rows and wallet
    audit rows unchanged.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/postgres/tx.go; internal/order/service.go:Buy
relevant_repository_areas:
- internal/order/service.go
- internal/postgres/order_repo.go
- internal/postgres/tx.go
setup_requirements:
- Candidate SHA and fresh migration 1–11 database; independent human baseline approval
  still pending.
- Go 1.26.0 and Docker Linux containers with PostgreSQL 16; all validation uses disposable
  Testcontainers databases.
- Trusted evaluator is held externally; locate it with ignored config/evaluator.local.yaml.
- Both conditions receive identical REQUEST.md, CONTRACT.md and allowlisted snapshot;
  do not mount this research checkout.
