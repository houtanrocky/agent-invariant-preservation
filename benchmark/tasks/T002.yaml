availability_assessment: Existing settlement retry safety is implemented. CancelBid
  rejects an already cancelled bid; post-expiry cancelled retry success is absent.
novel_change_assessment: Replaces redundant settlement candidate with a new cancellation
  outcome contract; no daily-limit changes.
