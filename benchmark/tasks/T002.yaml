schema_version: '1.0'
task_id: T002
title: Retry-safe bid cancellation
kind: backend_change
baseline_commit: 58913f27161296bab0d3d223e7452a370cba580d
problem_description: Extend AuctionServiceImpl.CancelBid(ctx, auctionID, bidID, bidderID)
  so an already cancelled bid returns nil for the same auction and recorded bidder,
  including after the deadline or auction settlement. This retry must have no effects.
  Active bids remain cancellable only under the existing rules. Preserve public signatures,
  schema, request-key semantics and settlement behavior.
expected_behavior:
- The first valid cancellation releases exactly its own active hold and marks only
  its bid cancelled.
- Matching cancelled-bid retries return nil before/after expiry and settlement, without
  any additional release or audit row.
- Different bidders or auction IDs are rejected; outbid or winning bids cannot be
  cancelled.
- Active bids past their deadline or on an ended auction remain rejected.
- Concurrent retries, unrelated holds and later settlements remain correct; persistence
  failure rolls back release and audit effects.
existing_invariants:
- id: reservation-release-once
  definition: Each cancelled bid releases its own reserved amount once. Retries preserve
    every persisted wallet, bid, auction and item row, including unrelated holds and
    audit rows.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/auction/service.go:CancelBid;
    internal/postgres/auction_repo.go
- id: cancellation-authorization
  definition: A foreign bidder or mismatched auction cannot cancel a bid; outbid and
    winning bids cannot release reserves or change settlement.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/auction/service.go:CancelBid
- id: cancellation-atomicity
  definition: A failed cancellation rolls back bid status, reservation release and
    wallet audit changes together; settlement conserves gold and transfers ownership
    only once.
  source: 58913f27161296bab0d3d223e7452a370cba580d:internal/postgres/tx.go; internal/auction/service.go:EndAuction
relevant_repository_areas:
- internal/auction/service.go
- internal/postgres/auction_repo.go
- internal/postgres/tx.go
setup_requirements:
- Candidate SHA and fresh migration 1–11 database; independent human baseline approval
  still pending.
- Go 1.26.0 and Docker Linux containers with PostgreSQL 16; all validation uses disposable
  Testcontainers databases.
- Trusted evaluator is held externally; locate it with ignored config/evaluator.local.yaml.
- Both conditions receive identical REQUEST.md, CONTRACT.md and allowlisted snapshot;
  do not mount this research checkout.
evaluation_commands:
- - go
  - test
  - -mod=readonly
  - -json
  - -count=1
  - -timeout=5m
  - ./internal/postgres
  - -run
  - ^TestT002Feature
- - go
  - test
  - -mod=readonly
  - -json
  - -count=1
  - -timeout=5m
  - ./internal/postgres
  - -run
  - ^TestT002Invariant
timeout_seconds: 600
hidden_evaluation_requirements:
- Inject the private task-specific oracle only in a fresh trusted evaluator after
  coding stops.
- Inspect SQL rows and audit effects, concurrent retries, authorization and injected
  persistence rollback.
- Zero daily limits in held task fixtures deliberately exclude repaired spending-policy
  behavior from task scoring.
reference_solution_status: draft
known_failure_cases:
- Feature succeeds but retries repeat financial effects.
- Cross-identity retry accepted.
- A failed mutation leaves partial durable effects.
